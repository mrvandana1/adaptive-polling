apiVersion: v1
kind: ServiceAccount
metadata: {name: dfc-controller, namespace: autoscale-lab}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: dfc-controller, namespace: autoscale-lab}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: dfc-controller, namespace: autoscale-lab}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: dfc-controller}
subjects: [{kind: ServiceAccount, name: dfc-controller, namespace: autoscale-lab}]
---
# Base config; only overrides of controller/dfc/config.py DEFAULTS are needed.
# Live overrides without redeploy:  curl -XPOST localhost:18080/config -d '{"scaling":{"target_per_pod":20}}'
apiVersion: v1
kind: ConfigMap
metadata: {name: dfc-config, namespace: autoscale-lab}
data:
  config.yaml: |
    target:
      namespace: autoscale-lab
      deployment: demo-app
      selector: app=demo-app
      metrics_port: 8000
    metrics:                     # change when swapping to an app with other metric names
      request_counter: http_requests_total
      latency_histogram: http_request_duration_seconds
    scaling:
      enabled: true
      metric: rps                # rps | cpu | queue
      target_per_pod: 30
      min_replicas: 1
      max_replicas: 20
    polling:
      mode: dynamic              # fixed | dynamic
    forecast:
      enabled: true
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: dfc-controller, namespace: autoscale-lab}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: dfc-controller}}
  template:
    metadata:
      labels: {app: dfc-controller, autoscale.lab/monitor: "true"}
    spec:
      serviceAccountName: dfc-controller
      containers:
        - name: controller
          image: dfc-controller:dev
          imagePullPolicy: IfNotPresent
          ports:
            - {containerPort: 8080, name: api}
            - {containerPort: 9100, name: metrics}
          volumeMounts:
            - {name: config, mountPath: /etc/dfc}
            - {name: data, mountPath: /data}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - {name: config, configMap: {name: dfc-config}}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: dfc-controller, namespace: autoscale-lab}
spec:
  selector: {app: dfc-controller}
  ports:
    - {name: api, port: 8080, targetPort: api}
    - {name: metrics, port: 9100, targetPort: metrics}

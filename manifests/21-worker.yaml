# Queue consumer (same image). Static replicas here; see optional/keda-worker.yaml to autoscale it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: autoscale-lab
spec:
  replicas: 1
  selector: {matchLabels: {app: worker}}
  template:
    metadata:
      labels: {app: worker, autoscale.lab/monitor: "true"}
    spec:
      containers:
        - name: worker
          image: demo-app:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "worker.py"]
          ports: [{containerPort: 8001, name: metrics}]
          env: [{name: REDIS_HOST, value: redis}]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}

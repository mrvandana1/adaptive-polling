# One generic monitor: anything labelled autoscale.lab/monitor=true with a container port
# named "http" or "metrics" is scraped every 5s at /metrics. Swapped apps get picked up automatically.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: autoscale-lab
  namespace: autoscale-lab
  labels: {release: kube-prometheus-stack}
spec:
  selector:
    matchLabels: {autoscale.lab/monitor: "true"}
  namespaceSelector: {matchNames: [autoscale-lab]}
  podMetricsEndpoints:
    - {port: http, path: /metrics, interval: 5s}
    - {port: metrics, path: /metrics, interval: 5s}
